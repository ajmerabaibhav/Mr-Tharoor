[project]
name = "mr-tharoor"
version = "0.1.0"
description = "An English teacher for macOS: reads how you write and what you dictate, and hands you a grammar lesson every morning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyobjc-framework-ApplicationServices>=10",  # the text box you are typing in
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/ajmerabaibhav/Mr-Tharoor"

[project.scripts]
tharoor = "mr_tharoor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mr_tharoor*"]
