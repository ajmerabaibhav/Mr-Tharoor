[project]
name = "mr-tharoor"
version = "0.1.0"
description = "A local pronunciation coach for macOS. Hears how you actually talk, and plays you the words you got wrong."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sounddevice>=0.5",                  # microphone capture
    "soundfile>=0.12",                   # reading and writing audio
    "numpy>=1.24",                       # everything numeric
    "cmudict>=1.0",                      # canonical pronunciations, offline
    "torch>=2.0",                        # runs the phoneme model
    "transformers>=4.30",                # loads wav2vec2-lv-60-espeak
    "faster-whisper>=1.0",               # the words you meant
    "huggingface-hub>=0.20",             # fetches both models
    "pyobjc-framework-AVFoundation>=10",  # Apple voice processing, 3-mic array
    "pyobjc-framework-Cocoa>=10",        # which app is in front
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/ajmerabaibhav/Mr-Roy-"

[project.scripts]
tharoor = "mr_tharoor.cli:main"
roy = "mr_tharoor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mr_tharoor*"]
