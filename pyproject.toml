[project]
name = "mr-roy"
version = "0.1.0"
description = "Hear how the word is actually said. Local pronunciation coach for macOS."
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.5",   # microphone capture
    "soundfile>=0.12",    # writing captured audio
]

[project.scripts]
roy = "mr_roy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mr_roy*"]
